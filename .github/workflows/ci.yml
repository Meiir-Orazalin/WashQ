name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_PORT: 4000
      DATABASE_URL: postgresql://washqueue:washqueue_ci@localhost:5432/washqueue_ci?schema=public
      TEST_DATABASE_URL: postgresql://washqueue:washqueue_ci@localhost:5432/washqueue_ci?schema=public
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: error
      API_DOCS_ENABLED: 'false'
      ACCESS_TOKEN_SIGNING_SECRET: ci-test-only-not-a-production-signing-secret
      ACCESS_TOKEN_LIFETIME_SECONDS: 900
      REFRESH_TOKEN_LIFETIME_SECONDS: 2592000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: washqueue_ci
          POSTGRES_USER: washqueue
          POSTGRES_PASSWORD: washqueue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U washqueue -d washqueue_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @washqueue/api db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test

      - name: Build applications
        run: pnpm build
        env:
          NODE_ENV: production
